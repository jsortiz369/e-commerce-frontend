<header class=" flex sticky shrink-0 items-center justify-between gap-3 px-3.5 transition-all duration-200">
    <div class="flex min-w-0 items-center">
        <!-- <button
            pButton
            target="admin-sidebar"
            severity="secondary"
            text
            size="small"
            aria-label="Contraer o expandir menú"
            (click)="toggleSidebar()"
        >
            <svg pIcon="sidebar"></svg>
        </button> -->
        <button 
            pButton 
            variant="text"
            size="small"
            severity="secondary"
            (click)="toggleSidebar()"
            class="p-1.5!"
        >
            <svg pIcon="sidebar" size="20"></svg>
        </button>
        
        <!-- class="size-7! p-0! text-secondary-500 hover:bg-primary-50/70! hover:text-primary-600! dark:text-secondary-400 dark:hover:bg-primary-950/40! dark:hover:text-primary-400!" -->
        <p-divider [align]="'center'" layout="vertical" class="m-1!" type="solid" />
    </div>

    <div class="flex items-center gap-1.5">
    
    
        <button
            type="button"
            class="hidden md:inline-flex h-7 w-48 items-center justify-between rounded-md border border-secondary-200/80 dark:border-secondary-800 bg-secondary-50/50 dark:bg-secondary-950/60 px-2.5 text-xs text-secondary-500 dark:text-secondary-400 transition-colors hover:border-secondary-300 hover:text-secondary-700"
        >
            <span class="flex items-center gap-1.5 truncate">
                <svg pIcon="search" class="size-3! shrink-0"></svg>
                <span class="truncate">Buscar módulo...</span>
            </span>
            <kbd class="rounded border border-secondary-200 dark:border-secondary-700 bg-surface-0 dark:bg-surface-900 px-1 py-0.2 text-[10px] font-sans text-secondary-500">
                Ctrl K
            </kbd>
        </button>

        <div class="hidden sm:inline-flex h-7 items-center gap-1.5 rounded-md border border-secondary-200/80 dark:border-secondary-800 bg-secondary-50/60 dark:bg-secondary-900/60 px-2 text-[11px] font-medium text-secondary-700 dark:text-secondary-300">
            <span class="size-1.5 rounded-full bg-success"></span>
            <span>Tienda activa</span>
        </div>

        <button
            type="button"
            class="relative inline-flex size-7 items-center justify-center rounded-md text-secondary-500 dark:text-secondary-400 transition-colors hover:bg-primary-50/70 dark:hover:bg-primary-950/40 hover:text-primary-600 dark:hover:text-primary-400"
            aria-label="Notificaciones"
        >
            <svg pIcon="bell" class="size-3.5!"></svg>
            <span class="absolute top-1.5 right-1.5 size-1.5 rounded-full bg-primary ring-2 ring-surface-0 dark:ring-surface-900"></span>
        </button>
    </div>
</header>
