<p-dialog
    [(visible)]="visible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [header]="'Registrar Nuevo Idioma'"
    [style]="{ width: '32rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <div class="flex flex-col gap-4 pt-1">
        <p-message severity="info" variant="outlined" size="small">
            Los campos obligatorios están marcados con un asterisco (<strong class="text-danger-600">*</strong>).
        </p-message>

        <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between">
                <label class="text-xs font-semibold text-surface-700 dark:text-surface-200">
                    Bandera / Imagen del idioma <span class="text-danger-600">*</span>
                </label>
                <span class="text-[11px] text-surface-500 dark:text-surface-400">
                    {{ acceptedFormatsLabel }} - Máx. {{ formatSize(maxFileSize) }}
                </span>
            </div>

                <p-fileupload
                    #fu
                    mode="advanced"
                    accept="image/*"
                    [maxFileSize]="maxFileSize"
                    [customUpload]="true"
                    [showUploadButton]="false"
                    [showCancelButton]="false"
                    (onSelect)="onFileSelect($event)"
                    [pt]="{
                        root: { class: ' border-0! bg-transparent! p-0! w-64!' },
                        header: { class: 'hidden! p-0! border-0!' },
                        content: { class: 'p-0! border-0! bg-transparent! w-64!' }
                    }"
                    class="justify-items-center!"
                >
                    <ng-template #header let-chooseCallback="chooseCallback">
                        <span class="hidden" (click)="chooseCallback()"></span>
                    </ng-template>
                    
                    <ng-template 
                        #content
                        let-chooseCallback="chooseCallback" 
                        let-clearCallback="clearCallback"
                        let-files
                    >
                        @if (files.length > 0) {
                            <div class="group h-40 relative flex items-center justify-between rounded-xl border-2 border-dashed dark:border-primary-800/70 bg-primary-50/30 dark:bg-primary-950/20 transition-all border-surface-300 dark:border-surface-700 hover:border-primary hover:bg-primary-50/25 dark:hover:border-primary-400 dark:hover:bg-primary-950/20">
                                @for (file of files; track $index; let i = $index) {
                                    <img
                                        [src]="file.objectURL"
                                        [alt]="file.name"
                                        class="size-full absolute inset-0 rounded-xl"
                                    />
                                }

                                <div class="absolute top-0 -left-9 gap-1">
                                    <button
                                        type="button"
                                        pButton
                                        size="small"
                                        severity="primary"
                                        (click)="chooseCallback()"
                                        iconOnly
                                    >
                                        <svg pIcon="refresh" [size]="15"></svg>
                                    </button>
                                </div>

                                <div class="absolute top-10 -left-9 gap-1">
                                    <button
                                        type="button"
                                        pButton
                                        iconOnly
                                        size="small"
                                        severity="danger"
                                        aria-label="Quitar imagen"
                                        (click)="clearCallback();"
                                    >
                                        <svg pIcon="trash" [size]="14"></svg>
                                    </button>
                                </div>
                            </div>
                        }
                    </ng-template>

                    <ng-template #empty>
                        <div
                            class="h-40 group cursor-pointer rounded-xl border-2 border-dashed p-1.5 text-center transition-all duration-200 border-surface-300 dark:border-surface-700 hover:border-primary hover:bg-primary-50/25 dark:hover:border-primary-400 dark:hover:bg-primary-950/20"
                            (click)="fu.choose()"
                        >
                            <div class="mx-auto flex flex-col items-center justify-center gap-2">
                                <div
                                    class="flex size-11 items-center justify-center rounded-xl border border-primary-200/70 dark:border-primary-800/70 bg-primary-50 dark:bg-primary-950/60 text-primary transition-transform duration-200 group-hover:scale-105"
                                >
                                    <svg pIcon="image" [size]="20"></svg>
                                </div>

                                <div class="flex flex-col gap-0.5">
                                    <span class="text-xs font-semibold text-surface-800 dark:text-surface-100">
                                        Haz clic para seleccionar o arrastra la bandera aquí
                                    </span>
                                    <span class="text-[11px] text-surface-500 dark:text-surface-400">
                                        Relación recomendada 4:3 o 16:10
                                    </span>
                                </div>

                                <button
                                    type="button"
                                    pButton
                                    size="small"
                                    severity="secondary"
                                    variant="outlined"
                                    class="mt-1 pointer-events-none"
                                >
                                    <svg pIcon="upload" [size]="13"></svg>
                                    <span>Seleccionar imagen</span>
                                </button>
                            </div>
                        </div>
                    </ng-template>
                </p-fileupload>

    <ng-template #footer>
        <div class="flex w-full items-center justify-end gap-2 pt-1">
            <button
                type="button"
                pButton
                size="small"
                variant="outlined"
                severity="secondary"
            >
                <span>Cancelar</span>
            </button>

            <button
                type="button"
                pButton
                size="small"
                severity="primary"
            >
                <svg pIcon="check" [size]="14"></svg>
                <span>Guardar idioma</span>
            </button>
        </div>
    </ng-template>
</p-dialog>
