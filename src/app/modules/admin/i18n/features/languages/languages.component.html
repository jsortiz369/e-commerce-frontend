<div class="flex flex-col gap-2.5">
   
    <p-card [pt]="{ root: { class: 'shadow-md!'}, body: { class: 'p-0!' }}">
        <p-table
            #dt
            [lazy]="true"
            [lazyLoadOnInit]="false"
            [totalRecords]="languagesTable().total"
            [value]="languagesTable().data"
            [rows]="languagesTable().rows"
            (onLazyLoad)="onLazyLanguages($event)"
            removableSort 
            [sortField]="initSortField()"
            [sortOrder]="initSortOrder() === 'desc' ? 1 : -1"
            sortMode="single"
            dataKey="id"
            selectionMode="single"
            [rowsPerPageOptions]="[10, 25, 50, 100]"
            paginator
            rowHover
            showCurrentPageReport
            currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} idiomas"
            scrollHeight="calc(100dvh - 12rem)"
            [scrollable]="true"
            stripedRows 
            [tableStyle]="{ 'min-width': '100%' }"
        >
            <ng-template #caption>
                <div class="flex items-center gap-2 justify-end">
                    
                    <p-iconfield iconPosition="left">
                        <p-inputicon>
                            <svg pIcon="search" class="size-3.5!"></svg>
                        </p-inputicon>
                        <input
                            pInputText
                            type="text"
                            pSize="small"
                            placeholder="Buscar..."
                            class="w-full sm:w-52"
                        />
                    </p-iconfield>

                    <button 
                        pButton 
                        iconOnly
                        size="small"
                        variant="outlined"
                        pTooltip="Recargar la lista de idiomas"
                        tooltipPosition="top"
                        plain
                        (click)="refetchLanguages()"
                    >
                        <svg pIcon="sync" [size]="18" class="text-primary"></svg>
                    </button>
                </div>
            </ng-template>

            <ng-template #header>
                <tr>
                    <th style="width: 1.5rem; min-width: 1.5rem; max-width: 1.5rem;">
                        <p-tableheadercheckbox [disabled]="languagesTable().loading"/>
                    </th>

                    <th pSortableColumn="name" style="min-width: 12rem; width: 12rem; max-width: 12rem">
                        <div class="flex items-center gap-1.5">
                            <span>Language</span>
                            <p-sorticon field="name" />
                        </div>
                    </th>

                    <th pSortableColumn="code" style="min-width: 3rem; width: 3rem; max-width: 3rem">
                        <div class="flex items-center gap-1.5">
                            <span>Código</span>
                            <p-sorticon field="code" />
                        </div>
                    </th>

                     <th pSortableColumn="isActive" style="min-width: 5.5rem; width: 5.5rem; max-width: 5.5rem">
                        <div class="flex items-center gap-1.5">
                            <span>Visible</span>
                            <p-sorticon field="isActive" />
                        </div>
                    </th>

                    <th pSortableColumn="isActive" style="min-width: 6rem; width: 6rem; max-width: 6rem">
                        <div class="flex items-center gap-1.5">
                            <span>Estado</span>
                            <p-sorticon field="isActive" />
                        </div>
                    </th>

                    <th pSortableColumn="createdAt" style="min-width: 11rem; width: 11rem; max-width: 11rem;">
                        <div class="flex items-center gap-1.5">
                            <span>Creado</span>
                            <p-sorticon field="createdAt" />
                        </div>
                    </th>

                    <th pSortableColumn="updatedAt" style="min-width: 11rem; width: 11rem; max-width: 11rem;">
                        <div class="flex items-center gap-1.5">
                            <span>Actualizado</span>
                            <p-sorticon field="updatedAt" />
                        </div>
                    </th>

                    <th class="text-right!" style="width: 6rem">
                        <span>Acciones</span>
                    </th>
                </tr>
            </ng-template>

            <ng-template #body let-item let-i="rowIndex">
                <tr>
                    @if (languagesTable().loading) {
                        <td>
                            <p-skeleton width="1.175rem" height="1.175rem" borderRadius="0.275rem" />
                        </td>

                        <td>
                            <div class="flex items-center gap-3">
                                <p-skeleton width="2.125rem" height="2.125rem" borderRadius="0.25rem" />
                                <div class="flex flex-col gap-1">
                                    <p-skeleton width="8rem" height="0.875rem" borderRadius="4px" />
                                    @if(i === 0) {
                                        <p-skeleton width="5rem" height="1.125rem" borderRadius="4px" />
                                    }
                                </div>
                            </div>
                        </td>

                        <td>
                            <div class="flex items-center gap-0.5">
                                <p-skeleton width="2rem" height="1.25rem" borderRadius="0.25rem" />
                                <p-skeleton width="1.5rem" height="1.25rem" borderRadius="0.25rem" />
                            </div>
                        </td>
                        <td><p-skeleton width="3rem" height="1rem" borderRadius="16px" /></td>
                        <td><p-skeleton width="3rem" height="1rem" borderRadius="16px" /></td>
                        <td><p-skeleton width="8rem" height="1rem" borderRadius="16px" /></td>
                        <td><p-skeleton width="8rem" height="1rem" borderRadius="16px" /></td>
                        <td><p-skeleton width="5rem" height="1.75rem" borderRadius="0.5rem"/></td>
                    } @else {
                        <td>
                            <p-tablecheckbox [value]="item" [disabled]="item.isDefault" />
                        </td>

                        <td>
                            <div class="flex items-center gap-3 py-0.5">
                                <p-avatar size="normal">
                                    <img 
                                        class="rounded-sm object-cover"
                                        [alt]="item.name"
                                        [appLanguageImgFallback]="item.image"
                                    >
                                </p-avatar>

                                <div class="flex flex-col min-w-0">
                                    <span class="font-semibold truncate">
                                        {{ item.name }}
                                    </span>
                                    @if (item.isDefault) {
                                                    
                                        <p-badge value="Predeterminado" severity="success" size="small"  />
                                    }
                                </div>
                            </div>
                        </td>

                        <td>
                            <div class="flex items-center gap-1.5">
                                <p-tag
                                    [value]="item.code"
                                    [severity]="item.isDefault ? 'info' : 'secondary'"
                                    [rounded]="false"
                                />
                                <p-tag
                                    [value]="item.direction || 'RTL'"
                                    [severity]="item.direction === 'RTL' ? 'warn' : 'info'"
                                    [rounded]="true"
                                />
                            </div>
                        </td>

                        <td>
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="size-1.5 shrink-0 rounded-full bg-success"></span>
                                <span class="truncate">Visible</span>
                            </div>
                        </td>

                        <td>
                            <div class="flex items-center gap-2">
                                <p-tag
                                    [value]="item.isActive ? 'Activo' : 'Inactivo'"
                                    [severity]="item.isActive ? 'success' : 'secondary'"
                                    [rounded]="true"
                                />
                            </div>
                        </td>

                        <td>
                            {{ item.createdAt | localizedDate }}
                        </td>

                        <td>
                            {{ item.updatedAt | localizedDate }}
                        </td>

                        <td class="text-right!">
                            <button 
                                pButton 
                                iconOnly 
                                aria-label="Save"
                                size="small"
                                text
                                (click)="menu.toggle($event)"
                            >
                                <svg pIcon="ellipsis-v" [size]="18"></svg>
                            </button>
                            <p-menu #menu [model]="itemsDataTable()" [popup]="true" styleClass="w-40" />
                        </td>
                    }
            </ng-template>
            
        </p-table>
    </p-card>
</div>
